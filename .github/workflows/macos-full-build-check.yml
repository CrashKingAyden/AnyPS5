name: macOS full build check

on:
  push:
    branches: ['claude/macos-full-build-check', 'claude/macos-vulkan-loader', 'claude/macos-libkernel', 'claude/macos-rebased']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Full build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Report host
        run: |
          uname -m
          sw_vers
          sysctl -n machdep.cpu.brand_string
          clang --version
          cmake --version
          /usr/bin/arch -x86_64 /usr/bin/true && echo "x86-64 execution available" || echo "no x86-64 execution"
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON 2>&1 | tee configure.log
      - name: Build everything, keep going past errors
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build -- -k 0 2>&1 | tee build.log
      - name: Build patched libraries
        id: libs
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build --target libs -- -k 0 2>&1 | tee libs.log
          ls -1 build/core/libs/libs/*.prx | wc -l
      - name: Summarize errors
        if: always()
        run: |
          annotate() {
            local title="$1" body="$2"
            [ -n "$body" ] || body="(none)"
            body="${body//'%'/'%25'}"
            body="${body//$'\n'/'%0A'}"
            echo "::notice title=$title::$body"
          }
          for log in build.log libs.log; do
            [ -f "$log" ] || continue
            annotate "$log failed targets ($(grep -cE '^FAILED: ' "$log" || true))" "$(grep -E '^FAILED: ' "$log" | sort -u | cut -c1-240 | head -100)"
            annotate "$log errors" "$(grep -E 'error:|Undefined symbols|ld: |referenced from' "$log" | sed 's|'"$GITHUB_WORKSPACE"'/||g' | sort -u | cut -c1-400 | head -400)"
          done
          annotate "prx count" "$(ls -1 build/core/libs/libs/*.prx 2>/dev/null | wc -l) $(ls build/core/libs/libs 2>/dev/null | head -80 | tr '\n' ' ')"
          annotate "host" "$(uname -m) $(sysctl -n machdep.cpu.brand_string) $(sw_vers -productVersion)"
      - name: Run tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ctest --test-dir build --output-on-failure --timeout 120 2>&1 | tee ctest.log
      - name: Summarize tests
        if: always()
        run: |
          [ -f ctest.log ] || exit 0
          body="$(grep -E 'tests passed|tests failed|\(Failed\)|\(Timeout\)|\(SEGFAULT\)|\(Subprocess|Not Run' ctest.log | head -80)"
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          echo "::notice title=ctest::$body"
      - name: Publish error reports to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/report"
          mkdir -p "$dir"
          for log in configure.log build.log libs.log ctest.log; do
            [ -f "$log" ] || continue
            grep -E -B2 -A6 'error:|Undefined symbols|ld: |FAILED: |\(Failed\)|tests passed|tests failed' "$log" | sed 's|'"$GITHUB_WORKSPACE"'/||g' | head -20000 > "$dir/$log" || true
          done
          [ -f ctest.log ] && sed 's|'"$GITHUB_WORKSPACE"'/||g' ctest.log | gzip -9 > "$dir/ctest-full.log.gz"
          name="${GITHUB_REF_NAME//\//-}-${{ matrix.runner }}"
          cd "$RUNNER_TEMP"
          git clone --depth 1 --branch ci-logs "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" logs 2>/dev/null || { git init -q logs && git -C logs checkout -q -b ci-logs && git -C logs remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"; }
          rm -rf "logs/$name" && mkdir -p "logs/$name" && cp "$dir"/* "logs/$name/" 2>/dev/null || true
          echo "${GITHUB_SHA}" > "logs/$name/commit"
          cd logs
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "logs for $name at ${GITHUB_SHA}" || exit 0
          for attempt in 1 2 3 4 5; do
            git push -q origin ci-logs && exit 0
            git pull -q --rebase origin ci-logs || true
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.runner }}
          path: '*.log'
