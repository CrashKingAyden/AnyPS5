name: macOS full build check

on:
  push:
    branches: ['claude/macos-full-build-check', 'claude/macos-vulkan-loader']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Full build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Report host
        run: |
          uname -m
          sw_vers
          sysctl -n machdep.cpu.brand_string
          clang --version
          cmake --version
          /usr/bin/arch -x86_64 /usr/bin/true && echo "x86-64 execution available" || echo "no x86-64 execution"
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON 2>&1 | tee configure.log
      - name: Build everything, keep going past errors
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build -- -k 0 2>&1 | tee build.log
      - name: Build patched libraries
        id: libs
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build --target libs -- -k 0 2>&1 | tee libs.log
          ls -1 build/core/libs/libs/*.prx | wc -l
      - name: Summarize errors
        if: always()
        run: |
          annotate() {
            local title="$1" body="$2"
            [ -n "$body" ] || body="(none)"
            body="${body//'%'/'%25'}"
            body="${body//$'\n'/'%0A'}"
            echo "::notice title=$title::$body"
          }
          for log in build.log libs.log; do
            [ -f "$log" ] || continue
            annotate "$log failed targets ($(grep -cE '^FAILED: ' "$log" || true))" "$(grep -E '^FAILED: ' "$log" | sort -u | cut -c1-240 | head -60)"
            annotate "$log errors" "$(grep -E 'error:|Undefined symbols|ld: |referenced from' "$log" | sed 's|'"$GITHUB_WORKSPACE"'/||g' | sort -u | cut -c1-300 | head -80)"
          done
          annotate "prx count" "$(ls -1 build/core/libs/libs/*.prx 2>/dev/null | wc -l) $(ls build/core/libs/libs 2>/dev/null | head -80 | tr '\n' ' ')"
          annotate "host" "$(uname -m) $(sysctl -n machdep.cpu.brand_string) $(sw_vers -productVersion)"
      - name: Run tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ctest --test-dir build --output-on-failure --timeout 120 2>&1 | tee ctest.log
      - name: Summarize tests
        if: always()
        run: |
          [ -f ctest.log ] || exit 0
          body="$(grep -E 'tests passed|tests failed|\(Failed\)|\(Timeout\)|\(SEGFAULT\)|\(Subprocess|Not Run' ctest.log | head -80)"
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          echo "::notice title=ctest::$body"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.runner }}
          path: '*.log'
